; BofaNodes PHP defaults for websites. Override per server with an .ini file in php-fpm/conf.d.
memory_limit=256M
upload_max_filesize=64M
post_max_size=64M
max_execution_time=120
max_input_time=120
max_input_vars=3000
date.timezone=UTC
expose_php=Off

; APCu: in-memory cache WordPress and Drupal cache plugins can use
apc.enabled=1
apc.shm_size=32M
